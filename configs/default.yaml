grid:
  height: 48
  width: 48
  cell_size_m: 100.0        # metres per cell (real DEMs: 10-30 m)
sim:
  steps: 24                 # forecast horizon in steps
  dt_minutes: 30.0
  flow_coeff: 0.20
  infiltration_m: 0.002
data:
  n_train: 160
  n_val: 24
  n_test: 24
  seed: 7
model:
  hidden_channels: 24
train:
  epochs: 12
  batch_size: 8
  lr: 0.002
  rollout_steps: 24
  device: cpu
evacuation:
  road_spacing_cells: 4
  n_shelters: 4
  n_origins: 40
  walk_speed_mps: 1.4
  max_safe_depth_m: 0.30    # walking evacuees
  depart_step: 4
